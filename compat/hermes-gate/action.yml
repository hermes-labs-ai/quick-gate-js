name: Hermes Gate
description: Run a receipt-bound Hermes Gate command in your repository
author: Hermes Labs

branding:
  icon: check-circle
  color: purple

inputs:
  command:
    description: Hermes Gate command to run (fast, full, review, or doctor)
    required: false
    default: fast
  version:
    description: Published hermes-gate version to install from PyPI
    required: false
    default: 0.1.7
  python-version:
    description: Python version used to install and run Hermes Gate
    required: false
    default: "3.11"
  working-directory:
    description: Repository directory that contains .hermes/gate.toml
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Hermes Gate
      shell: bash
      env:
        HERMES_GATE_VERSION: ${{ inputs.version }}
      run: python -m pip install --disable-pip-version-check "hermes-gate==${HERMES_GATE_VERSION}"
    - name: Run Hermes Gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HERMES_GATE_COMMAND: ${{ inputs.command }}
      run: |
        case "${HERMES_GATE_COMMAND}" in
          fast|full|review|doctor) hermes-gate "${HERMES_GATE_COMMAND}" ;;
          *)
            echo "command must be one of: fast, full, review, doctor" >&2
            exit 2
            ;;
        esac
